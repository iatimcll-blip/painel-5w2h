<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Rotinas de Trabalho</title>
<style>
/* Layout: barra translúcida fixa no topo, título grande estilo iOS, abas de profissionais em pílulas roláveis, cartões agrupados em grade fluida */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F2F2F5; --surface-3:#E8E8ED;
  --fg:#1D1D1F; --fg-2:#6E6E73; --fg-3:#AEAEB2;
  --line:rgba(60,60,67,.13); --card-border:rgba(0,0,0,0);
  --accent:#0071E3; --accent-soft:rgba(0,113,227,.10); --on-accent:#FFFFFF;
  --ok:#1E7B34; --ok-soft:rgba(52,199,89,.16);
  --warn:#A45400; --warn-soft:rgba(255,149,0,.17);
  --bad:#C9001A; --bad-soft:rgba(255,59,48,.12);
  --glass:rgba(245,245,247,.74); --seg-bg:rgba(118,118,128,.12); --seg-on:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 22px rgba(0,0,0,.05);
  --m-fca:#5E5CE6; --m-pdca:#0A8F8F; --m-ish:#C24E00; --m-5w:#0071E3; --on-ish:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
  --fg:#F5F5F7; --fg-2:#98989D; --fg-3:#636366;
  --line:rgba(84,84,88,.55); --card-border:rgba(255,255,255,.06);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18); --on-accent:#FFFFFF;
  --ok:#30D158; --ok-soft:rgba(48,209,88,.16);
  --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.16);
  --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
  --glass:rgba(22,22,24,.72); --seg-bg:rgba(118,118,128,.24); --seg-on:#636366;
  --shadow:none;
  --m-fca:#7D7AFF; --m-pdca:#40C8E0; --m-ish:#FF9F0A; --m-5w:#0A84FF; --on-ish:#1C1C1E;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
  --fg:#F5F5F7; --fg-2:#98989D; --fg-3:#636366;
  --line:rgba(84,84,88,.55); --card-border:rgba(255,255,255,.06);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18); --on-accent:#FFFFFF;
  --ok:#30D158; --ok-soft:rgba(48,209,88,.16);
  --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.16);
  --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
  --glass:rgba(22,22,24,.72); --seg-bg:rgba(118,118,128,.24); --seg-on:#636366;
  --shadow:none;
  --m-fca:#7D7AFF; --m-pdca:#40C8E0; --m-ish:#FF9F0A; --m-5w:#0A84FF; --on-ish:#1C1C1E;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.47 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
fieldset{border:0;margin:0;padding:0;min-width:0}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:13px;color:var(--fg-2);white-space:nowrap}
.savestate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savestate[data-s="busy"] i{background:var(--warn)}
.savestate[data-s="err"] i{background:var(--bad)}
.savestate[data-s="local"] i{background:var(--fg-3)}

.seg{display:inline-flex;background:var(--seg-bg);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}

/* Abas de profissionais */
.ptabs-wrap{overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.ptabs-wrap::-webkit-scrollbar{display:none}
.ptabs{display:flex;gap:8px;padding-block:14px 4px;width:max-content}
.ptab{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:500;box-shadow:var(--shadow);border:1px solid var(--card-border);white-space:nowrap;transition:background .2s,color .2s}
.ptab.plain{padding:7px 14px}
.ptab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.ptab.add{background:transparent;box-shadow:none;border:1px dashed var(--fg-3);color:var(--accent);padding:6px 14px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;letter-spacing:0}
.av.lg{width:64px;height:64px;font-size:22px}
.av.md{width:40px;height:40px;font-size:14px}

/* Tipografia */
.hero{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.028em;margin:4px 0 0;text-wrap:balance}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
.muted{color:var(--fg-2)}
.small{font-size:13px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin-bottom:6px}

/* Estrutura */
.stack{display:flex;flex-direction:column;gap:20px;padding-block:16px 104px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--card-border);padding:20px;min-width:0}
@media (min-width:720px){.card{padding:24px}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.kpi{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--card-border);min-width:0}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--fg-2);margin-top:2px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;background:var(--accent);color:var(--on-accent);white-space:nowrap;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.quiet{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.ibtn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--fg-2);display:inline-grid;place-items:center;flex:none}
.ibtn:hover{background:var(--surface-2);color:var(--bad)}
.ibtn svg{width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Campos */
.field{width:100%;border:1px solid transparent;background:var(--surface-2);border-radius:11px;padding:10px 12px;font:16px/1.4 var(--font);color:var(--fg);resize:none;transition:border-color .15s,box-shadow .15s,background .15s;letter-spacing:-.01em;min-width:0}
.field::placeholder{color:var(--fg-3)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
textarea.field{field-sizing:content;min-height:44px}
.field.title{background:transparent;border-color:transparent;padding:2px 6px;margin-left:-6px;font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.025em}
.field.title:hover{background:var(--surface-2)}
.field.sub{background:transparent;padding:2px 6px;margin-left:-6px;font-size:15px;color:var(--fg-2)}
.field.sub:hover{background:var(--surface-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.span-all{grid-column:1/-1}

/* Pílulas de status */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-andamento{background:var(--warn-soft);color:var(--warn)}
.s-concluido{background:var(--ok-soft);color:var(--ok)}
.s-atrasada{background:var(--bad-soft);color:var(--bad)}
.stseg{display:inline-flex;background:var(--seg-bg);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.stseg button{border:0;background:transparent;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--fg-2)}
.stseg button[aria-pressed="true"][data-s="pendente"]{background:var(--seg-on);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.stseg button[aria-pressed="true"][data-s="andamento"]{background:var(--warn);color:#fff}
.stseg button[aria-pressed="true"][data-s="concluido"]{background:var(--ok);color:#fff}

/* Perfil */
.profile{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.profile .meta{display:flex;flex-wrap:wrap;gap:0 4px;align-items:center;min-width:0}
.profile .meta .field.sub{width:auto;flex:1 1 140px}
@media (max-width:600px){.profile{grid-template-columns:auto 1fr}.profile .ringbox{grid-column:1/-1;justify-self:start;display:flex;align-items:center;gap:12px}}
.ringbox{text-align:center}
.ring{display:block}
.ring .track{stroke:var(--surface-3)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .6s}
.ring text{fill:var(--fg);font:700 15px var(--font)}

/* Métodos */
.mseg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--seg-bg);border-radius:14px;padding:3px;gap:3px}
.mseg button{border:0;background:transparent;border-radius:11px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.mseg button b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.mseg button span{font-size:11px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mseg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mseg button[data-m="fca"][aria-pressed="true"] b{color:var(--m-fca)}
.mseg button[data-m="pdca"][aria-pressed="true"] b{color:var(--m-pdca)}
.mseg button[data-m="ish"][aria-pressed="true"] b{color:var(--m-ish)}
.mseg button[data-m="w5"][aria-pressed="true"] b{color:var(--m-5w)}
.mhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.mhead p{margin:4px 0 0;color:var(--fg-2);max-width:62ch;font-size:14px}
.mtag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* FCA */
.fca-list{display:flex;flex-direction:column;gap:12px}
.fca-row{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr)) 32px;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--surface-2)}
.fca-row .field{background:var(--surface)}
.fca-row .num{font:600 13px var(--mono);color:var(--m-fca);padding-top:26px}
.fca-row .ibtn{margin-top:22px}
@media (max-width:760px){.fca-row{grid-template-columns:1fr 32px}.fca-row .num{padding-top:0;grid-column:1/-1}.fca-row .cell{grid-column:1}.fca-row .ibtn{grid-column:2;grid-row:1;margin-top:-6px}}

/* PDCA */
.pdca-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:18px}
.pdca{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"plan do" "act check";gap:14px;position:relative}
.ph{border-radius:18px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px;min-width:0}
.ph[data-k="plan"]{grid-area:plan}.ph[data-k="do"]{grid-area:do}.ph[data-k="check"]{grid-area:check}.ph[data-k="act"]{grid-area:act}
.ph .field{background:var(--surface)}
.ph-h{display:flex;align-items:center;gap:12px}
.ph-l{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:700;background:var(--surface);color:var(--m-pdca);flex:none}
.ph[data-st="concluido"] .ph-l{background:var(--ok);color:#fff}
.ph[data-st="andamento"] .ph-l{background:var(--warn);color:#fff}
.ph-h small{display:block;color:var(--fg-2);font-size:12px;line-height:1.35}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 8px var(--bg),var(--shadow);display:grid;place-items:center;text-align:center;pointer-events:none}
.card .hub{box-shadow:0 0 0 8px var(--surface)}
.hub b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.hub small{font-size:10px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:760px){.pdca{grid-template-columns:1fr;grid-template-areas:"plan" "do" "check" "act"}.hub{display:none}}

/* Ishikawa */
.fishwrap{overflow-x:auto;border-radius:16px;background:var(--surface-2);margin-block:6px 18px}
.fish{display:block;width:100%;min-width:760px;height:auto}
.fish .spine{stroke:var(--fg);stroke-width:3;stroke-linecap:round}
.fish .bone{stroke:var(--fg-2);stroke-width:2;stroke-linecap:round}
.fish .twig{stroke:var(--fg-3);stroke-width:1.2}
.fish .head{fill:var(--m-ish)}
.fish .headtxt{fill:#fff;font:600 14px var(--font)}
.fish .cat{fill:var(--fg);font:700 13px var(--font);letter-spacing:.02em}
.fish .cz{fill:var(--fg);font:12px var(--font)}
.fish .more{fill:var(--fg-2);font:italic 11px var(--font)}
.fish .raiz{fill:var(--fg);font:600 12px var(--font)}
.fish .raizl{fill:var(--m-ish);font:700 10px var(--font);letter-spacing:.08em}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.cat{border-radius:16px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cat h4{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cat h4 span{font-size:12px;color:var(--fg-2);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:10px;padding:5px 4px 5px 10px;font-size:13px;max-width:100%;border:1px solid var(--line)}
.chip span{overflow-wrap:anywhere}
.chip button{border:0;background:transparent;color:var(--fg-3);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.chip button:hover{color:var(--bad);background:var(--bad-soft)}
.chip button svg{width:11px;height:11px}
.addline{display:flex;gap:6px}
.addline .field{background:var(--surface);padding:7px 10px;font-size:14px}

/* 5W2H */
.w5sum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.w5sum b{color:var(--fg);font-variant-numeric:tabular-nums}
.acoes{display:flex;flex-direction:column;gap:14px}
.acao{border-radius:18px;background:var(--surface-2);padding:16px;display:flex;flex-direction:column;gap:14px;border-left:4px solid var(--fg-3)}
.acao[data-st="andamento"]{border-left-color:var(--warn)}
.acao[data-st="concluido"]{border-left-color:var(--ok)}
.acao[data-late="1"]{border-left-color:var(--bad)}
.acao .field{background:var(--surface)}
.acao-h{display:flex;gap:10px;align-items:flex-start}
.acao-h .n{font:600 13px var(--mono);color:var(--m-5w);padding-top:12px;flex:none}
.acao-h .field{font-size:17px;font-weight:600}
.acao-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.q{font-size:11px;font-weight:700;color:var(--m-5w);letter-spacing:.04em;margin-right:4px}

/* Resumo */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;border-radius:0}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface-2);border-radius:12px}
.prow .nm{font-weight:600;font-size:16px}
.prow .pb{font-size:13px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg-2);font-variant-numeric:tabular-nums}
.badge.fca{color:var(--m-fca)}.badge.pdca{color:var(--m-pdca)}.badge.ish{color:var(--m-ish)}.badge.w5{color:var(--m-5w)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 32px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:var(--m-ish)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.next{display:flex;flex-direction:column}
.nx{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.nx:last-child{border-bottom:0}
.dt{text-align:center;border-radius:10px;background:var(--surface-2);padding:4px 0;font-variant-numeric:tabular-nums}
.dt b{display:block;font-size:17px;line-height:1.1}
.dt small{font-size:10px;text-transform:uppercase;color:var(--fg-2);letter-spacing:.05em}
.dt.late{background:var(--bad-soft);color:var(--bad)}
.dt.late small{color:var(--bad)}
.nx .w{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx .who{font-size:12px;color:var(--fg-2)}
.export{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.exp{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:var(--surface-2);border:0;text-align:left;width:100%}
.exp:hover{background:var(--surface-3)}
.exp .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.exp .ic svg{width:22px;height:22px}
.exp b{display:block;font-size:15px}
.exp small{color:var(--fg-2);font-size:12px}
.exp[aria-busy="true"]{opacity:.6;pointer-events:none}

.empty{text-align:center;padding:48px 20px}
.empty .gly{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:15px;letter-spacing:-.02em}
.empty p{color:var(--fg-2);max-width:46ch;margin:8px auto 18px}
.tip{font-size:13px;color:var(--fg-2);padding:12px 14px;border-radius:12px;background:var(--surface-2)}

/* Relatório */
.doc{max-width:880px;margin:0 auto;width:100%}
.doc .card{padding:28px}
@media (min-width:720px){.doc .card{padding:44px 52px}}
.doc h2{font-size:24px;margin-bottom:10px}
.doc section{display:flex;flex-direction:column;gap:12px;padding-block:22px;border-top:1px solid var(--line)}
.doc section:first-of-type{border-top:0;padding-top:8px}
.doc p{margin:0;max-width:68ch}
.doc ul{margin:0;padding-left:20px;max-width:68ch}
.doc li{margin-bottom:4px}
.tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.cover{display:flex;flex-direction:column;gap:6px;padding-bottom:18px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}

/* Folha (modal) */
.sheet{position:fixed;inset:0;z-index:62;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.sheet form{background:var(--surface);border-radius:22px;padding:24px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--card-border)}
@media (max-width:600px){.sheet{place-items:end center;padding:0 0 env(safe-area-inset-bottom,0px)}.sheet form{border-radius:22px 22px 0 0;width:100%}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:70;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.ro .stseg{pointer-events:none}
.ro [data-act="fca-add"],.ro [data-act="fca-del"],.ro [data-act="fca-to-5w"],.ro [data-act="w5-add"],.ro [data-act="w5-del"],.ro [data-act="cause-del"],.ro .addline{display:none}

/* Guia */
.hint{font-size:12.5px;color:var(--fg-2);margin:6px 2px 0;line-height:1.4}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px 2px;text-align:left;display:inline-flex;align-items:center;gap:5px;align-self:flex-start}
.linkbtn svg{width:13px;height:13px}
.linkbtn:hover{text-decoration:underline}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:12px;color:var(--fg-2);flex:none;font-variant-numeric:tabular-nums}
.dot svg{width:14px;height:14px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:2px 0;color:var(--fg-2);min-width:0}
.step+.step::before{content:"";position:absolute;top:16px;left:calc(-50% + 20px);right:calc(50% + 20px);height:2px;border-radius:2px;background:var(--surface-3)}
.step.done+.step::before{background:var(--ok)}
.step .dot{width:30px;height:30px;position:relative;z-index:1;transition:background .2s}
.step:hover .dot{background:var(--surface-3)}
.step.done .dot{background:var(--ok);color:#fff}
.step.cur .dot{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step .sl{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.cur .sl{color:var(--fg);font-weight:600}
.nextstep{display:flex;gap:14px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--accent-soft)}
.nextstep .nk{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.nextstep h3{margin-top:3px;text-wrap:balance}
.nextstep p{margin:4px 0 0;font-size:14px;color:var(--fg-2);max-width:62ch}
.nextstep.ok{background:var(--ok-soft)}.nextstep.ok .nk{color:var(--ok)}
.nextstep.bad{background:var(--bad-soft)}.nextstep.bad .nk{color:var(--bad)}
.nextstep .btn{white-space:normal;text-align:left}
details.howto{border-radius:14px;background:var(--surface-2);padding:0 16px;margin-bottom:18px}
details.howto summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:10px}
details.howto summary::-webkit-details-marker{display:none}
details.howto summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--fg-2);border-bottom:2px solid var(--fg-2);transform:rotate(-45deg);transition:transform .2s}
details.howto[open] summary::before{transform:rotate(45deg)}
details.howto ol{margin:0 0 12px;padding-left:22px;font-size:14px;max-width:72ch}
details.howto li{margin-bottom:6px}
details.howto .ex{margin:0 0 14px;font-size:13px;color:var(--fg-2);padding:10px 12px;background:var(--surface);border-radius:10px}
details.howto .ex b{color:var(--fg);margin-right:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mnext{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.ck{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2)}
.ck i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--fg-3);display:grid;place-items:center;flex:none}
.ck i svg{width:10px;height:10px}
.ck.ok{color:var(--fg)}.ck.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.mseg button b{white-space:nowrap;display:inline-flex;align-items:center}
.mn{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-3);color:var(--fg-2);font-size:10px;font-weight:700;margin-right:6px;flex:none}
.mn svg{width:10px;height:10px}
.mn.ok{background:var(--ok);color:#fff}
@media (max-width:420px){.mn{display:none}}
.fromfca{border-radius:16px;border:1px dashed var(--fg-3);padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.fromfca .r{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;align-items:center;font-size:14px}
@media (max-width:560px){.fromfca .r{grid-template-columns:1fr}}
select.field{padding:8px 10px;font-size:14px;cursor:pointer}
.cat .cd{margin:-6px 0 0;font-size:12px;color:var(--fg-2)}
.chip .chip-t{width:auto;height:auto;display:inline;border-radius:0;flex:0 1 auto;min-width:0;border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.chip .chip-t:hover{color:var(--m-ish);background:transparent}
.chip.raiz{background:var(--m-ish);border-color:var(--m-ish);color:var(--on-ish);font-weight:600}
.chip.raiz .chip-t:hover{color:var(--on-ish)}
.chip.raiz button:hover{background:rgba(0,0,0,.15)}
.chip.raiz button{color:var(--on-ish)}
.miss{font-size:12px;color:var(--warn);font-weight:600}
.nexthint{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nexthint.ok{color:var(--ok)}.nexthint.bad{color:var(--bad)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan li.ok .dot{background:var(--ok);color:#fff}
.plan li.cur .dot{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent-soft)}
.plan b{font-size:15px;font-weight:600}
.plan p{margin:2px 0 0;font-size:13px;color:var(--fg-2)}
.plan li.ok b{color:var(--fg-2)}
@media (max-width:520px){.plan li{grid-template-columns:28px minmax(0,1fr)}.plan li>.btn{grid-column:2;justify-self:start}}
.card,[id]{scroll-margin-top:84px}
.mseg{scroll-margin-top:84px}

/* Assistente */
.aifab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 18px 12px 14px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.22);transition:transform .15s}
.aifab:hover{transform:translateY(-1px)}
.aifab svg{width:20px;height:20px}
.aidrawer{position:fixed;z-index:45;top:calc(12px + env(safe-area-inset-top,0px));right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 24px));background:var(--surface);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:600px){.aidrawer{top:auto;left:0;right:0;bottom:0;width:100%;height:88vh;height:88dvh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.aih{display:flex;align-items:center;gap:12px;padding:14px 12px 12px 16px;border-bottom:1px solid var(--line)}
.aiav{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.aiav svg{width:18px;height:18px}
.aih b{display:block;font-size:15px}
.aih span#aictx{display:block;font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aih .ibtn{margin-left:auto}
.aih .ibtn:hover{color:var(--fg);background:var(--surface-2)}
.aimsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;min-height:0}
.msg{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.msg.u{align-items:flex-end}
.bub{border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.45;max-width:92%;overflow-wrap:anywhere}
.msg.a .bub{background:var(--surface-2);border-bottom-left-radius:6px}
.msg.u .bub{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}
.bub ul{margin:4px 0 6px;padding-left:18px}.bub li{margin-bottom:3px}
.bub.err{background:var(--bad-soft)}
.typing{display:inline-flex;gap:4px;padding:5px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.sugs{display:flex;flex-direction:column;gap:8px;width:100%}
.sug{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.sg-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sg-t{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.sg-b{font-size:13px;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.sg-b small{color:var(--fg-2);font-weight:600;margin-right:4px}
.sg-ok{font-size:12px;font-weight:600;color:var(--ok);display:inline-flex;gap:4px;align-items:center}
.sg-ok svg{width:12px;height:12px}
.aichips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none;flex:none}
.aichips::-webkit-scrollbar{display:none}
.aichips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.aichips button:hover{background:var(--surface-2)}
.aichips button[disabled]{opacity:.45;cursor:default}
.aiform{display:flex;gap:8px;align-items:flex-end;padding:8px 14px 6px;flex:none}
.aiform .field{min-height:42px;max-height:140px;font-size:15px;flex:1}
.aiform .btn{height:42px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.ainote{margin:0;padding:0 16px 12px;font-size:11.5px;color:var(--fg-2);flex:none}
@media print{.aifab,.aidrawer{display:none!important}}
@media (max-width:600px){body.ai-open .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}}
.loading{color:var(--fg-2);padding:40px 0;text-align:center}

/* Perfis e acesso */
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.userchip .rl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;flex:none}
.userchip .un{color:var(--fg-2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth{max-width:440px;margin:40px auto 96px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .msg-err{color:var(--bad);font-size:13px;margin:0}
.auth .msg-ok{color:var(--ok);font-size:13px;margin:0}
.team{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{font-weight:600;font-size:16px}
.trow .em{font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow select.field,.fsel{width:auto;padding:5px 8px;font-size:13px}
.tprivs{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-left:54px;font-size:13px}
.pv{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg)}
.pv input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.gbtn{width:100%;padding:11px 18px;border:1px solid var(--line)}
.gbtn svg{width:18px;height:18px}
.ou{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:12px;color:var(--fg-2)}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line)}
.spark{display:block;margin-left:auto}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark path.area{fill:var(--accent-soft);stroke:none}
@media (max-width:640px){.tprivs{padding-left:0}.trow{grid-template-columns:auto minmax(0,1fr)}.trow>.tm{grid-column:2;justify-content:flex-start;text-align:left}.trow .spark{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Rotinas de Trabalho: identidade, navegação e telas novas ===== */
:root{--radius:22px;--ease:cubic-bezier(.2,.8,.2,1);--tabbar-h:0px}
body{font-feature-settings:"ss01","cv11";text-rendering:optimizeLegibility}
.top{border-bottom:.5px solid var(--line)}
.top .wrap{min-height:58px}
.brand{align-items:center;gap:10px}
.brand .bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand .bt b{font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand .bt span{font-size:11px;color:var(--fg-2);letter-spacing:.04em;font-weight:500}
.logo{width:32px;height:32px;flex:none;display:block;filter:drop-shadow(0 2px 6px rgba(10,132,255,.25))}
.logo svg,.splash-logo svg{width:100%;height:100%;display:block}
/* navegação principal: segmentado no topo, barra de abas embaixo no celular */
.mainnav{display:inline-flex;background:var(--seg-bg);border-radius:12px;padding:3px;gap:2px}
.mainnav button{border:0;background:transparent;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--fg-2);white-space:nowrap;transition:background .25s var(--ease),color .25s var(--ease)}
.mainnav button svg{width:17px;height:17px;flex:none}
.mainnav button{position:relative}
.nbadge{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
@media (max-width:760px){.nbadge{position:absolute;top:0;right:6px}}
.mainnav button:hover{color:var(--fg)}
.mainnav button[aria-current="page"]{background:var(--seg-on);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (max-width:760px){
  :root{--tabbar-h:64px}
  .mainnav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0;justify-content:space-around;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
  .mainnav button{flex-direction:column;gap:2px;padding:4px 10px;font-size:10.5px;background:transparent!important;box-shadow:none!important}
  .mainnav button svg{width:22px;height:22px}
  .mainnav button[aria-current="page"]{color:var(--accent)}
  .stack{padding-bottom:calc(120px + var(--tabbar-h))}
  .aifab{bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom,0px))}
  .brand .bt span{display:none}
  .savestate span{display:none}
}
/* abertura (sem piscar no F5) */
.splash{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--fg-2)}
.splash-logo{width:84px;height:84px;display:block;border-radius:22px;box-shadow:0 12px 40px rgba(10,132,255,.25)}
.splash b{font-size:20px;color:var(--fg);letter-spacing:-.02em}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--surface-3);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.view-in{animation:viewin .38s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* cartões no estilo Apple */
.card{border-radius:var(--radius)}
.click{cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s}
.click:hover{transform:translateY(-2px);box-shadow:0 2px 6px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08)}
.click:active{transform:scale(.99)}
button.kpi{text-align:left;font:inherit;color:inherit;width:100%}
.kpi .tr{font-size:12px;font-weight:600;margin-top:4px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 2px -4px}
.sec-h h2{font-size:24px}
/* login */
.auth .logo-lg{width:64px;height:64px;margin-bottom:14px;display:block;border-radius:16px;box-shadow:0 10px 30px rgba(10,132,255,.22)}
/* avisos de método */
.mstate{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.mstate.ok{background:var(--ok-soft);color:var(--ok)}
.mstate.warn{background:var(--warn-soft);color:var(--warn)}
.mstate b{font-weight:700}
.mstate .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:currentColor}
.mstate .ic svg{width:12px;height:12px;color:#fff}
.mn.warn{background:var(--warn);color:#fff}
.toast{display:flex;align-items:center;gap:12px}
.toast.ok{background:var(--ok);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast button{border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
/* gestão */
.alerts{display:flex;flex-direction:column}

.dotb{width:26px;height:26px;border-radius:50%;border:0;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--fg-3);cursor:pointer;transition:transform .15s}
.dotb:hover{transform:scale(1.15)}
.dotb svg{width:12px;height:12px}
.dotb.ok{background:var(--ok);color:#fff}.dotb.cur{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:11px}
.ugroup{border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border);overflow:hidden}
.ugroup>summary{list-style:none;cursor:pointer;padding:18px 20px}

.uhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center}

.ugroup[open] .uhead .chev{transform:rotate(45deg)}
.ubody{padding:0 20px 18px;display:flex;flex-direction:column;gap:12px}
.uprivs{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2)}
.pcard .pn{font-weight:600}
.pcard .pp{font-size:12.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pcard .pr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

<script>
(function(){
"use strict";
/* ---------- Constantes ---------- */
const CATS=[["metodo","Método"],["maquina","Máquina"],["material","Material"],["maoDeObra","Mão de obra"],["meioAmbiente","Meio ambiente"],["medida","Medida"]];
const PHASES=[["plan","P","Planejar","Defina o problema, a meta e o plano de ação."],["do","D","Executar","Coloque o plano em prática e registre o que foi feito."],["check","C","Verificar","Compare o resultado com a meta pelo indicador."],["act","A","Agir","Padronize o que funcionou ou corrija o rumo."]];
const STATUS={pendente:"Pendente",andamento:"Em andamento",concluido:"Concluído"};
const HUES=["#0071E3","#5E5CE6","#0A8F8F","#C24E00","#AF52DE","#1E7B34"];
const METHODS=[["fca","FCA"],["pdca","PDCA"],["ish","Ishikawa"],["w5","5W2H"]];
const LS_KEY="painel5w2h.v1", PREF_KEY="painel5w2h.prefs";
const CFG=window.PAINEL_CONFIG||{}, NUVEM_ON=!!(CFG.firebase&&CFG.firebase.apiKey&&CFG.firebase.projectId);
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const ICON={
  plus:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
  trash:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg>',
  x:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  slides:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 12l3-3 2 2 4-4"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  arrow:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>'
};

/* ---------- Estado ---------- */
const S={profs:[],cfg:defCfg(),view:"painel",tab:"resumo",method:{},mode:"loading",db:null,ro:false,loaded:false,confirmDel:null,focusSel:null,scrollSel:null,pendingRemote:false,guide:true,howOpen:{},
  fb:false,roAll:false,ready:{p:false,c:false},prevOk:{},gOpen:{},gShow:{},drill:null,drillStack:[],user:null,perfil:null,perfis:[],hist:[],upd:{},fUser:"",pendingNome:"",auth:{modo:"entrar",msg:"",erro:false,email:""}};
function defCfg(){return{titulo:"Programa de Melhoria Contínua",empresa:"",responsavel:"",conclusao:""}}
// Na nuvem, a navegação (aba, método, tela) fica só nesta aba do navegador: outra aba com outro usuário não é afetada.
function prefStore(){try{return NUVEM_ON?window.sessionStorage:window.localStorage}catch(e){return null}}
try{const pr=JSON.parse(prefStore().getItem(PREF_KEY)||"{}");if(pr.view)S.view=pr.view;if(pr.tab)S.tab=pr.tab;if(pr.method)S.method=pr.method;if(pr.guide===false)S.guide=false;}catch(e){}
function savePrefs(){try{prefStore().setItem(PREF_KEY,JSON.stringify({view:S.view,tab:S.tab,method:S.method,guide:S.guide}))}catch(e){}}

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"p")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{if(!s)return"—";const[a,m,d]=s.split("-");return d+"/"+m+"/"+a};
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:0};
const trunc=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1).trimEnd()+"…":s};
const initials=n=>{const p=String(n||"?").replace(/\(.*?\)/g,"").trim().split(/\s+/).filter(Boolean);return((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()};
const firstName=n=>String(n||"Sem nome").replace(/\(.*?\)/g,"").trim().split(/\s+/)[0]||"Sem nome";
const plural=(n,a,b)=>n+" "+(n===1?a:b);
function wrap(t,n){const w=String(t||"").split(/\s+/);const out=[];let l="";for(const x of w){if((l+" "+x).trim().length>n&&l){out.push(l);l=x}else l=(l+" "+x).trim()}if(l)out.push(l);return out}
function setPath(o,path,v){const k=path.split(".");let c=o;for(let i=0;i<k.length-1;i++){c=c[k[i]]}c[k[k.length-1]]=v}
function hue(p){return HUES[(p.cor||0)%HUES.length]}
function cur(){return S.profs.find(p=>p.id===S.tab)}
// Privilégios que o administrador libera por usuário (as mesmas chaves do firestore.rules).
const PRIVS=[["verEquipe","Ver equipe","Vê os trabalhos e a evolução de todos, sem editar"],["editarEquipe","Editar equipe","Edita os trabalhos dos outros usuários"],["editarPrograma","Dados do programa","Altera título, empresa, responsável e parecer"],["excluir","Excluir","Apaga trabalhos: os próprios, ou os da equipe com Editar equipe"]];
const nuvem=()=>S.mode==="nuvem";
const isSuper=()=>nuvem()&&!!S.user&&S.user.verified&&!!CFG.adminEmail&&S.user.email.toLowerCase()===String(CFG.adminEmail).toLowerCase();
const isAdmin=()=>nuvem()&&(isSuper()||(!!S.perfil&&S.perfil.papel==="admin"));
const can=k=>!nuvem()||isAdmin()||!!(S.perfil&&S.perfil.priv&&S.perfil.priv[k]);
const aprovadoC=()=>!nuvem()||isAdmin()||(!!S.perfil&&(S.perfil.status||"aprovado")==="aprovado");
const seeTeam=()=>nuvem()&&aprovadoC()&&(can("verEquipe")||can("editarEquipe"));
const pedidos=()=>S.perfis.filter(u=>u.status==="pendente");
const canEdit=p=>!S.roAll&&(!nuvem()||!p||p.owner===(S.user&&S.user.id)||can("editarEquipe"));
const canDel=p=>!S.roAll&&(!nuvem()||(can("excluir")&&(isAdmin()||p.owner===(S.user&&S.user.id)||can("editarEquipe"))));
const cfgLocked=()=>nuvem()&&!can("editarPrograma");
const visProfs=()=>seeTeam()&&S.fUser?S.profs.filter(p=>p.owner===S.fUser):S.profs;
const exId=id=>S.mode==="nuvem"&&S.user?id+"-"+S.user.id.slice(0,8):id;
const hashN=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const fmtDT=s=>{const d=new Date(s);return isNaN(d)?"—":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})};
function ownerName(id){const u=S.perfis.find(x=>x.id===id);return u?(u.nome||u.email||"Usuário"):"—"}

function blankPhase(){return{texto:"",status:"pendente"}}
function blankProf(nome,cargo,setor,ordem){return{nome,cargo,setor,ordem,cor:ordem%HUES.length,problema:"",criadoEm:new Date().toISOString(),
  fca:[],pdca:{indicador:"",meta:"",resultado:"",plan:blankPhase(),do:blankPhase(),check:blankPhase(),act:blankPhase()},
  ishikawa:{efeito:"",raiz:"",causas:Object.fromEntries(CATS.map(([k])=>[k,[]]))},w5h2:[]}}
function norm(id,d){
  const p=JSON.parse(JSON.stringify(d||{}));p.id=id;
  p.nome=p.nome||"";p.cargo=p.cargo||"";p.setor=p.setor||"";p.problema=p.problema||"";p.ordem=num(p.ordem);p.cor=num(p.cor);
  p.fca=Array.isArray(p.fca)?p.fca.map(r=>({fato:r.fato||"",causa:r.causa||"",acao:r.acao||""})):[];
  p.pdca=p.pdca||{};["indicador","meta","resultado"].forEach(k=>p.pdca[k]=p.pdca[k]||"");
  PHASES.forEach(([k])=>{const f=p.pdca[k]||{};p.pdca[k]={texto:f.texto||"",status:STATUS[f.status]?f.status:"pendente"}});
  p.ishikawa=p.ishikawa||{};p.ishikawa.efeito=p.ishikawa.efeito||"";p.ishikawa.raiz=p.ishikawa.raiz||"";
  const cz=p.ishikawa.causas||{};p.ishikawa.causas=Object.fromEntries(CATS.map(([k])=>[k,Array.isArray(cz[k])?cz[k].map(String):[]]));
  p.w5h2=Array.isArray(p.w5h2)?p.w5h2.map(a=>({id:a.id||uid("a"),oque:a.oque||"",porque:a.porque||"",onde:a.onde||"",quando:a.quando||"",quem:a.quem||"",como:a.como||"",quanto:a.quanto==null?"":String(a.quanto),status:STATUS[a.status]?a.status:"pendente"})):[];
  return p;
}
function body(p){const b=JSON.parse(JSON.stringify(p));delete b.id;delete b.owner;return b}

/* ---------- Métricas ---------- */
function metrics(p){
  const fcaFull=p.fca.filter(r=>r.fato&&r.causa&&r.acao).length;
  const fcaScore=p.fca.length?fcaFull/p.fca.length:0;
  const st=PHASES.map(([k])=>p.pdca[k].status);
  const pdcaDone=st.filter(s=>s==="concluido").length;
  const pdcaScore=st.reduce((a,s)=>a+(s==="concluido"?1:s==="andamento"?.5:0),0)/4;
  const causas=CATS.reduce((a,[k])=>a+p.ishikawa.causas[k].length,0);
  const catsUsed=CATS.filter(([k])=>p.ishikawa.causas[k].length).length;
  const ishScore=(p.ishikawa.efeito?.25:0)+(catsUsed/6)*.5+(p.ishikawa.raiz?.25:0);
  const acoes=p.w5h2.length;
  const conc=p.w5h2.filter(a=>a.status==="concluido").length;
  const and=p.w5h2.filter(a=>a.status==="andamento").length;
  const late=p.w5h2.filter(isLate).length;
  const w5Score=acoes?p.w5h2.reduce((a,x)=>a+(x.status==="concluido"?1:x.status==="andamento"?.5:0),0)/acoes:0;
  const custo=p.w5h2.reduce((a,x)=>a+num(x.quanto),0);
  const prog=Math.round((fcaScore+pdcaScore+ishScore+w5Score)/4*100);
  return{fca:p.fca.length,fcaFull,pdcaDone,causas,catsUsed,acoes,conc,and,pend:acoes-conc-and,late,custo,prog};
}
function isLate(a){return a.status!=="concluido"&&a.quando&&a.quando<today()}
function totals(){
  const t={n:S.profs.length,fca:0,causas:0,acoes:0,conc:0,and:0,pend:0,late:0,custo:0,pdcaDone:0,prog:0,cat:Object.fromEntries(CATS.map(([k])=>[k,0]))};
  S.profs.forEach(p=>{const m=metrics(p);t.fca+=m.fca;t.causas+=m.causas;t.acoes+=m.acoes;t.conc+=m.conc;t.and+=m.and;t.pend+=m.pend;t.late+=m.late;t.custo+=m.custo;t.pdcaDone+=m.pdcaDone;t.prog+=m.prog;CATS.forEach(([k])=>t.cat[k]+=p.ishikawa.causas[k].length)});
  t.prog=t.n?Math.round(t.prog/t.n):0;return t;
}
function allActions(){const out=[];S.profs.forEach(p=>p.w5h2.forEach((a,i)=>out.push({p,a,i})));return out}
function sumario(){
  const t=totals();if(!t.n)return["Ainda não há profissionais cadastrados no painel."];
  const out=[];
  out.push(`Este relatório consolida as análises de melhoria contínua de ${plural(t.n,"profissional","profissionais")}, aplicando quatro ferramentas complementares: FCA (Fato, Causa e Ação), ciclo PDCA, Diagrama de Ishikawa (6M) e plano de ação 5W2H.`);
  const top=CATS.map(([k,l])=>[l,t.cat[k]]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,2);
  out.push(`Foram registrados ${plural(t.fca,"fato","fatos")} no FCA e ${plural(t.causas,"causa","causas")} no Ishikawa`+(top.length?`, com maior concentração em ${top.map(x=>`${x[0]} (${x[1]})`).join(" e ")}.`:"."));
  if(t.acoes)out.push(`O plano 5W2H reúne ${plural(t.acoes,"ação","ações")}: ${t.conc} concluída(s), ${t.and} em andamento e ${t.pend} pendente(s)`+(t.late?` (${t.late} em atraso)`:"")+`. Investimento previsto: ${BRL.format(t.custo)}.`);
  else out.push("Nenhuma ação foi registrada no plano 5W2H até o momento.");
  out.push(`No ciclo PDCA, ${t.pdcaDone} de ${t.n*4} fases estão concluídas. A maturidade média das análises é de ${t.prog}%.`);
  return out;
}
function recomendacoes(){
  const r=[];const t=totals();
  if(t.late)r.push(`Repactuar prazos e responsáveis das ${plural(t.late,"ação em atraso","ações em atraso")} do plano 5W2H.`);
  const semRaiz=S.profs.filter(p=>!p.ishikawa.raiz).map(p=>firstName(p.nome));
  if(semRaiz.length)r.push(`Priorizar a causa raiz no Ishikawa de: ${semRaiz.join(", ")}.`);
  const semCheck=S.profs.filter(p=>p.pdca.do.status!=="pendente"&&p.pdca.check.status==="pendente").map(p=>firstName(p.nome));
  if(semCheck.length)r.push(`Iniciar a fase Verificar do PDCA (medição contra a meta) para: ${semCheck.join(", ")}.`);
  const semAcao=S.profs.filter(p=>!p.w5h2.length).map(p=>firstName(p.nome));
  if(semAcao.length)r.push(`Converter as ações do FCA em plano 5W2H para: ${semAcao.join(", ")}.`);
  const fechados=S.profs.filter(p=>p.pdca.act.status==="concluido").map(p=>firstName(p.nome));
  if(fechados.length)r.push(`Padronizar e divulgar as boas práticas dos ciclos concluídos (${fechados.join(", ")}).`);
  if(!r.length)r.push("Manter a rotina de acompanhamento quinzenal dos indicadores e do plano de ação.");
  return r;
}

/* ---------- Persistência ---------- */
const timers={},chains={},dirty=new Set();let cfgTimer=null,cfgDirty=false;
function setSave(s,txt){const el=$("#savestate");el.dataset.s=s;el.lastElementChild.textContent=txt}
function savedLabel(){if(S.mode==="local")setSave("local","Salvo neste navegador");else if(S.mode==="nuvem")setSave(S.user?"ok":"local",S.user?"Salvo na nuvem":"Desconectado");else if(S.ro)setSave("local","Somente leitura");else setSave("ok","Salvo")}
function touch(id){if(S.ro)return;dirty.add(id);setSave("busy","Salvando…");clearTimeout(timers[id]);timers[id]=setTimeout(()=>persist(id),650)}
function persist(id){
  delete timers[id];
  if(S.mode==="local"){saveLocal();dirty.delete(id);savedLabel();return}
  if(S.mode==="nuvem"){
    const p=S.profs.find(x=>x.id===id);if(!p||!S.fb||!S.user){dirty.delete(id);return}
    if(!p.owner)p.owner=S.user.id;
    const row={owner:p.owner,dados:body(p),atualizado_em:new Date().toISOString()},h=histOf(p);
    chains[id]=(chains[id]||Promise.resolve()).then(async()=>{
      await FS().collection("profissionais").doc(id).set(row);
      S.upd[id]=row.atualizado_em;
      await FS().collection("historico").doc(id+"_"+h.dia).set(h).then(()=>mergeHist(h),()=>{});
    }).then(()=>{if(!timers[id])dirty.delete(id);if(!Object.keys(timers).length&&!cfgDirty)savedLabel()}).catch(e=>nuvemErr(e,id));
    return;
  }
  const p=S.profs.find(x=>x.id===id);if(!p||!S.db){dirty.delete(id);return}
  const data=body(p);
  chains[id]=(chains[id]||Promise.resolve()).then(()=>S.db.doc("profissionais/"+id).set(data)).then(()=>{if(!timers[id])dirty.delete(id);if(!Object.keys(timers).length&&!cfgDirty)savedLabel()}).catch(e=>writeErr(e,id));
}
function writeErr(e,id){
  if(e&&e.code==="invalid_argument"&&!S.roAll){S.roAll=true;toast("Você tem acesso somente de leitura a este painel.");render()}
  else if(e&&e.code==="quota_exceeded")toast("Limite de armazenamento atingido. Remova registros antigos para continuar.");
  else if(e&&e.code==="unavailable"&&id){setTimeout(()=>persist(id),1200+Math.random()*800);return}
  setSave("err","Não salvo");
}
function saveCfg(){if(S.ro||cfgLocked())return;cfgDirty=true;setSave("busy","Salvando…");clearTimeout(cfgTimer);cfgTimer=setTimeout(()=>{
  if(S.mode==="local"){saveLocal();cfgDirty=false;savedLabel();return}
  if(S.mode==="nuvem"){FS().collection("config").doc("geral").set({dados:Object.assign({},S.cfg)}).then(()=>{cfgDirty=false;savedLabel()}).catch(e=>nuvemErr(e));return}
  S.db.doc("config/geral").set(Object.assign({},S.cfg)).then(()=>{cfgDirty=false;savedLabel()}).catch(e=>writeErr(e))},700)}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({profs:S.profs,cfg:S.cfg}))}catch(e){setSave("err","Não salvo")}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(d){S.profs=(d.profs||[]).map(p=>norm(p.id||uid(),p));S.cfg=Object.assign(defCfg(),d.cfg||{})}}catch(e){}}
async function removeProf(id){
  const dono=(S.profs.find(p=>p.id===id)||{}).owner;
  S.profs=S.profs.filter(p=>p.id!==id);clearTimeout(timers[id]);delete timers[id];dirty.delete(id);S.tab="resumo";S.confirmDel=null;savePrefs();render();
  if(S.mode==="local"){saveLocal();return}

function sortProfs(){S.profs.sort((a,b)=>a.ordem-b.ordem||String(a.criadoEm).localeCompare(String(b.criadoEm)))}
function onProfs(snap){
  const next=[];const seen=new Set();
  snap.docs.forEach(d=>{seen.add(d.id);if(dirty.has(d.id)){const loc=S.profs.find(p=>p.id===d.id);if(loc){next.push(loc);return}}next.push(norm(d.id,d.data()))});
  S.profs.forEach(p=>{if(!seen.has(p.id)&&dirty.has(p.id))next.push(p)});
  const before=JSON.stringify(S.profs);S.profs=next;sortProfs();
  const changed=before!==JSON.stringify(S.profs)||!S.loaded;S.loaded=true;
  if(S.tab!=="resumo"&&!cur())S.tab="resumo";

const pad2=n=>String(n).padStart(2,"0");
function newAction(o){return Object.assign({id:uid("a"),oque:"",porque:"",onde:"",quando:"",quem:"",como:"",quanto:"",status:"pendente"},o||{})}
function fcaPend(p){return p.fca.filter(r=>r.acao.trim()&&!p.w5h2.some(x=>x.oque.trim()===r.acao.trim())).length}
const FL=v=>{v=String(v==null?"":v).trim();return!!v&&!/\[[^\]]*\]/.test(v)};
function steps(p){
  const I=p.ishikawa,D=p.pdca,W=p.w5h2;
  const used=CATS.filter(([k])=>I.causas[k].length).length;
  return{
    id:{ok:!!(p.nome.trim()&&p.problema.trim()),checks:[["Nome do profissional",!!p.nome.trim()],["Problema descrito",!!p.problema.trim()]]},
    fca:{ok:p.fca.some(r=>FL(r.fato)&&FL(r.causa)&&FL(r.acao)),checks:[["Fato registrado",p.fca.some(r=>FL(r.fato))],["Causa apontada",p.fca.some(r=>FL(r.causa))],["Ação de bloqueio",p.fca.some(r=>FL(r.acao))]]},
    ish:{ok:!!I.efeito.trim()&&used>=3&&!!I.raiz.trim(),checks:[["Efeito descrito",!!I.efeito.trim()],["Causas em 3 ou mais categorias ("+used+"/6)",used>=3],["Causa raiz escolhida",!!I.raiz.trim()]]},
    w5:{ok:W.length>0&&W.every(a=>FL(a.oque)&&FL(a.quem)&&a.quando),checks:[["Ação cadastrada",W.length>0],["Responsável em todas",W.length>0&&W.every(a=>FL(a.quem))],["Prazo em todas",W.length>0&&W.every(a=>a.quando)]]},
    pdca:{ok:!!(D.indicador.trim()&&D.meta.trim())&&D.plan.status==="concluido",checks:[["Indicador definido",!!D.indicador.trim()],["Meta definida",!!D.meta.trim()],["Planejar concluído",D.plan.status==="concluido"]]}
  };

function nextStep(p){

  }

    if(!I.efeito.trim())return p.problema.trim()?{n:2,m:"ish",title:"Defina o efeito do Ishikawa",text:"O efeito é o problema que você quer resolver. Dá para reaproveitar o problema já descrito.",btn:"Usar o problema como efeito",run:"ish-efeito"}:{n:2,m:"ish",title:"Defina o efeito do Ishikawa",text:"O efeito é o problema que você quer resolver.",btn:"Ir para o campo",f:F("ishikawa.efeito")};

    if(used<3){const c=CATS.find(([k])=>!I.causas[k].length);return{n:2,m:"ish",title:"Distribua as causas nas categorias 6M",text:`Falta${3-used>1?"m":""} ${3-used} categoria${3-used>1?"s":""} para o mínimo de 3. Pergunte: o que em ${c[1]} contribui para o problema?`,btn:"Adicionar causa em "+c[1],f:F("add-"+c[0])};}

      if(I.raiz.trim())return{n:3,m:"w5",title:"Crie a ação para a causa raiz",text:`Causa raiz: “${trunc(I.raiz,90)}”. Defina o que será feito, quem faz e até quando.`,btn:"Criar ação",run:"w5-raiz"};

      return{n:3,m:"w5",title:"Cadastre a primeira ação",text:"Toda ação precisa de O quê, Quem e Quando.",btn:"Adicionar ação",run:"w5-add"};
    }
    const i=W.findIndex(a=>!(FL(a.oque)&&FL(a.quem)&&a.quando));const a=W[i];const k=!FL(a.oque)?"oque":!FL(a.quem)?"quem":"quando";
    return{n:3,m:"w5",title:`Defina ${{oque:"o que será feito",quem:"o responsável",quando:"o prazo"}[k]} na ação ${pad2(i+1)}`,text:"Sem O quê, Quem e Quando a ação não pode ser cobrada. Substitua também os campos entre colchetes.",btn:"Ir para o campo",f:F("w5h2."+i+"."+k)};

  const m=metrics(p);

  if(D.act.status!=="concluido")return{n:5,m:"pdca",title:"Conclua a fase Agir",text:"Marque Agir como concluído para fechar o ciclo.",btn:"Marcar Agir como concluído",run:"pdca-st",k:"act",s:"concluido"};

}

function autoText(p,k){

}

function ishView(p){

      ${S.guide?`<p class="hint">A causa que, se resolvida, mais reduz o problema</p>`:""}</div></div>
  <div class="fishwrap" id="fishbox">${fishSVG(p)}</div>
  ${fromFca.length&&!S.ro?`<div class="fromfca"><div><b>Causas do FCA para classificar</b><p class="muted small" style="margin:2px 0 0">Escolha a categoria de cada uma e ela entra no diagrama.</p></div>
    ${fromFca.map(([c,i])=>`<div class="r"><span>${esc(c)}</span><select class="field" id="${fid("cls-"+i)}" data-classify="${i}" aria-label="Categoria para: ${esc(trunc(c,40))}"><option value="">Classificar em…</option>${CATS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>`).join("")}</div>`:""}
  <div class="cats" id="cats">${CATS.map(([k,l])=>`<div class="cat"><h4>${l}<span>${I.causas[k].length}</span></h4><p class="cd">${CATDESC[k]}</p>

    <div class="addline"><input class="field" id="${fid("add-"+k)}" data-cause-input="${k}" placeholder="Nova causa e Enter" aria-label="Nova causa em ${l}"><button type="button" class="btn ghost sm" data-act="cause-add" data-c="${k}" aria-label="Adicionar causa em ${l}">${ICON.plus}</button></div></div>`).join("")}</div>`;

function fishSVG(p){
  const I=p.ishikawa,W=1000,H=400,sy=200,hx=790,xs=[150,370,590],dx=110;
  let s=`<svg class="fish" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama de Ishikawa">`;
  s+=`<line class="spine" x1="30" y1="${sy}" x2="${hx}" y2="${sy}"/>`;
  s+=`<rect class="head" x="${hx}" y="${sy-62}" width="190" height="124" rx="18"/>`;
  const ln=wrap(I.efeito||"Efeito (problema)",19).slice(0,4);
  ln.forEach((l,i)=>s+=`<text class="headtxt" x="${hx+95}" y="${sy-(ln.length-1)*9+i*18+5}" text-anchor="middle">${esc(l)}</text>`);
  CATS.forEach(([k,l],ci)=>{
    const top=ci<3,bx=xs[ci%3],y0=top?44:H-44,list=I.causas[k];
    s+=`<line class="bone" x1="${bx}" y1="${y0}" x2="${bx+dx}" y2="${sy}"/>`;
    s+=`<text class="cat" x="${bx}" y="${top?y0-16:y0+26}" text-anchor="middle">${esc(l.toUpperCase())}${list.length?" · "+list.length:""}</text>`;
    list.slice(0,5).forEach((c,i)=>{const yy=top?y0+22+i*25:y0-22-i*25;const bxx=bx+dx*((yy-y0)/(sy-y0));
      s+=`<line class="twig" x1="${(bxx-150).toFixed(1)}" y1="${yy}" x2="${bxx.toFixed(1)}" y2="${yy}"/><text class="cz" x="${(bxx-6).toFixed(1)}" y="${yy-5}" text-anchor="end">${esc(trunc(c,22))}</text>`});
    if(list.length>5){const yy=top?y0+22+5*25-6:y0-22-5*25+16;s+=`<text class="more" x="${bx+dx*((yy-y0)/(sy-y0))-6}" y="${yy}" text-anchor="end">+${list.length-5} causas</text>`}
  });
  if(I.raiz){const rl=wrap(I.raiz,26).slice(0,3);s+=`<text class="raizl" x="${hx}" y="${sy+92}">CAUSA RAIZ</text>`;rl.forEach((l,i)=>s+=`<text class="raiz" x="${hx}" y="${sy+110+i*16}">${esc(l)}</text>`)}
  return s+"</svg>";
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error("load"))};document.head.appendChild(s)})}
async function loadLib(name,urls,test){if(test())return;if(libs[name])return libs[name];libs[name]=(async()=>{for(const u of urls){try{await loadScript(u);if(test())return}catch(e){}}throw new Error("lib:"+name)})();try{return await libs[name]}catch(e){libs[name]=null;throw e}}

async function offer(filename,data){
  const dl=await getDL();
  if(!dl){
    if(!window.claude){try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Arquivo pronto: "+filename)}catch(e){toast("Não foi possível baixar o arquivo.")}return}
    toast("Para baixar o arquivo, abra o painel no claude.ai.");return}
  try{const r=await dl.save({filename,data});if(r&&r.status==="saved")toast("Arquivo pronto: "+filename)}
  catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited")toast("Já existe um download aguardando confirmação.");else toast("Não foi possível baixar o arquivo neste dispositivo.")}
}

}

/* ---------- Séries de evolução ---------- */
const diaISO=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function profSerie(p){
  const H=S.hist.filter(h=>h.prof_id===p.id).sort((a,b)=>a.dia.localeCompare(b.dia)).map(h=>[h.dia,h.maturidade]);
  const hoje=today(),v=metrics(p).prog;if(!H.length||H[H.length-1][0]!==hoje)H.push([hoje,v]);else H[H.length-1][1]=v;return H;
}
function mediaSerie(ps){
  if(!ps.length)return[];const series=ps.map(profSerie),dias=[...new Set(series.flat().map(x=>x[0]))].sort();
  return dias.map(d=>{const vs=series.map(s=>{let v=null;for(const[x,y]of s){if(x<=d)v=y;else break}return v}).filter(v=>v!=null);return[d,vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:0]});
}
const CORES=["#0A84FF","#5E5CE6","#30B0C7","#FF9F0A","#BF5AF2","#34C759","#FF375F","#64D2FF"];
function lineChart(series,o){
  o=o||{};const W=720,H=o.h||220,L=34,R=12,T=12,B=26;
  const vis=series.filter(s=>s.points.length);if(!vis.length)return`<p class="tip">Ainda não há histórico. A curva aparece conforme os dias de uso.</p>`;
  const dias=[...new Set(vis.flatMap(s=>s.points.map(p=>p[0])))].sort();
  const d0=new Date(dias[0]+"T00:00:00"),d1=new Date(dias[dias.length-1]+"T00:00:00"),span=Math.max(1,(d1-d0)/864e5);
  const X=d=>L+((new Date(d+"T00:00:00")-d0)/864e5)/span*(W-L-R),Y=v=>T+(1-v/100)*(H-T-B);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"Evolução da maturidade")}">`;
  [0,25,50,75,100].forEach(v=>s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`);
  const ticks=dias.length<=6?dias:[dias[0],dias[Math.floor(dias.length/3)],dias[Math.floor(dias.length*2/3)],dias[dias.length-1]];
  ticks.forEach(d=>s+=`<text class="axis" x="${X(d)}" y="${H-6}" text-anchor="middle">${d.slice(8,10)}/${d.slice(5,7)}</text>`);
  vis.forEach(se=>{if(se.hidden)return;const pts=se.points.length===1?[se.points[0],[dias[dias.length-1],se.points[0][1]]]:se.points;
    const d="M"+pts.map(p=>X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("L");
    if(o.area)s+=`<path class="ar" fill="${se.cor}" d="${d}L${X(pts[pts.length-1][0]).toFixed(1)} ${Y(0)}L${X(pts[0][0]).toFixed(1)} ${Y(0)}Z"/>`;
    s+=`<path class="ln" stroke="${se.cor}" d="${d}"/>`;
    const lp=pts[pts.length-1];s+=`<circle class="pt" cx="${X(lp[0]).toFixed(1)}" cy="${Y(lp[1]).toFixed(1)}" r="4.5" fill="${se.cor}"${se.drill?` data-act="drill" data-k="${se.drill[0]}" data-a="${se.drill[1]}"`:""}><title>${esc(se.name)}: ${Math.round(lp[1])}%</title></circle>`});
  return s+"</svg>";
}

const diasDesde=iso=>iso?Math.floor((Date.now()-new Date(iso))/864e5):null;

  ps.forEach(p=>{const n=diasDesde(S.upd[p.id]),ns=nextStep(p);if(n!=null&&n>=7&&!ns.done)out.push({tone:"warn",ic:"⏱",t:`${p.nome||"Profissional"} sem atualização há ${n} dias`,d:`${ownerName(p.owner)} · parado em: ${ns.title}`,k:"prof",a:p.id})});
  equipe().filter(e=>!uidF||e.u.id===uidF).forEach(e=>{

    <div class="mstate ${rec?"warn":"ok"}" role="status" style="margin-bottom:16px"><span class="ic"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="#fff"/></svg></span><span><b>${rec?"Recusado":"Aguardando aprovação"}</b> · ${esc(S.user.email)}</span></div>

main.addEventListener("submit",async e=>{
  if(e.target.id!=="pedidoform")return;e.preventDefault();
  const msg=$("#pd-msg").value.trim().slice(0,500),rec=S.perfil&&S.perfil.status==="recusado";
  try{await FS().collection("perfis").doc(S.user.id).update(rec?{status:"pendente",pedido:msg}:{pedido:msg});
    S.perfil=Object.assign({},S.perfil,{pedido:msg},rec?{status:"pendente"}:{});lastHTML=null;render();toast(rec?"Pedido enviado de novo.":"Mensagem enviada ao administrador.",{tone:"ok"})}
  catch(err){toast(authMsg(err))}
});
function pedidosCard(){
  if(!isAdmin())return"";const P=pedidos(),R=S.perfis.filter(u=>u.status==="recusado");
  if(!P.length&&!R.length)return"";
  const linha=(u,rec)=>`<div class="trow"><span class="av md" style="background:${HUES[hashN(u.id)%HUES.length]}" aria-hidden="true">${esc(initials(u.nome||u.email))}</span>
    <div style="min-width:0"><div class="nm">${esc(u.nome||"Sem nome")}</div><div class="em">${esc(u.email)}${u.criado_em?" · pediu em "+fmtDT(u.criado_em):""}</div>${u.pedido?`<p class="small" style="margin:6px 0 0">“${esc(u.pedido)}”</p>`:""}</div>
    <div class="tm row" style="gap:6px;justify-content:flex-end">${rec?`<button type="button" class="btn quiet sm" data-act="aprovar" data-u="${u.id}">Aprovar mesmo assim</button>`:`<button type="button" class="btn danger sm" data-act="recusar" data-u="${u.id}">Recusar</button><button type="button" class="btn sm" data-act="aprovar" data-u="${u.id}">${ICON.check}Aprovar</button>`}</div></div>`;
  return`<div class="card" id="pedidos"><div class="card-h"><div><div class="eyebrow" style="color:var(--bad)">${P.length?plural(P.length,"aguardando","aguardando"):"Nenhum pendente"}</div><h2 style="margin-top:4px">Pedidos de acesso</h2></div></div>
    <div class="team">${P.map(u=>linha(u,false)).join("")||`<p class="tip">Nenhum pedido aguardando.</p>`}</div>

async function decidirPedido(id,status){
  const u=S.perfis.find(x=>x.id===id);if(!u||!isAdmin())return;
  try{await FS().collection("perfis").doc(id).update({status});u.status=status;
    toast(status==="aprovado"?`${u.nome||u.email} foi aprovado e já pode usar o portal.`:`Pedido de ${u.nome||u.email} recusado.`,{tone:status==="aprovado"?"ok":""});lastHTML=null;render()}
  catch(e){toast(authMsg(e))}
}

/* ---------- Análise isolada (painel lateral) ---------- */
function openDrill(k,a,push){if(push!==false&&S.drill)S.drillStack.push(S.drill);S.drill={k,a};renderDrill()}
function closeDrill(){S.drill=null;S.drillStack=[];const d=$("#drill");d.hidden=true;d.innerHTML=""}
function renderDrill(){
  const d=$("#drill");if(!S.drill){d.hidden=true;return}
  const r=drillContent(S.drill.k,S.drill.a);if(!r){closeDrill();return}
  d.innerHTML=`<div class="drill-p" role="dialog" aria-modal="true" aria-label="${esc(r.t)}"><div class="drill-h">${S.drillStack.length?`<button type="button" class="ibtn" data-act="drill-back" aria-label="Voltar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>`:""}<div style="min-width:0;flex:1"><div class="eyebrow">${esc(r.e||"Análise")}</div><h2>${esc(r.t)}</h2></div><button type="button" class="ibtn" data-act="drill-close" aria-label="Fechar">${ICON.x}</button></div><div class="drill-b">${r.b}</div></div>`;
  d.hidden=false;
}
function tabela(head,rows){return`<div class="tbl"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")||`<tr><td colspan="${head.length}" class="muted">Nada para mostrar.</td></tr>`}</tbody></table></div>`}
const plink=p=>`<button type="button" class="linkbtn" style="padding:0" data-act="drill" data-k="prof" data-a="${p.id}">${esc(p.nome||"Sem nome")}</button>`;
const ulink=id=>`<button type="button" class="linkbtn" style="padding:0" data-act="drill" data-k="user" data-a="${id}">${esc(ownerName(id))}</button>`;
function drillContent(k,a){
  const eq=equipe();
  if(k==="prof"){
    const p=S.profs.find(x=>x.id===a);if(!p)return null;const m=metrics(p),I=p.ishikawa,D=p.pdca,st=steps(p);
    return{e:"Profissional · "+ownerName(p.owner),t:p.nome||"Sem nome",b:`
      <div class="card"><div class="profile">${av(p,"lg")}<div style="min-width:0"><h3>${esc(p.nome||"Sem nome")}</h3><div class="muted small">${esc([p.cargo,p.setor].filter(Boolean).join(" · ")||"—")}</div>${p.problema?`<p style="margin:8px 0 0"><b>Problema:</b> ${esc(p.problema)}</p>`:""}</div><div class="ringbox">${ring(m.prog,76)}<div class="muted small">maturidade</div></div></div>
        <div class="dots row" style="margin-top:14px;gap:6px">${dotsHTML(p)}</div>
        <div class="row" style="margin-top:14px"><button type="button" class="btn sm" data-act="open-prof" data-id="${p.id}" data-m="${nextStep(p).m||"fca"}">Abrir no painel ${ICON.arrow}</button>${canEdit(p)?`<button type="button" class="btn quiet sm" data-act="edit-prof" data-id="${p.id}">Editar dados</button>`:""}</div></div>
      <div class="card"><div class="card-h"><h3>Evolução da maturidade</h3></div>${lineChart([{name:p.nome,cor:"#0A84FF",points:profSerie(p)}],{area:true,h:180,label:"Evolução de "+p.nome})}</div>
      ${alertas().filter(x=>x.a===p.id).length?`<div class="card"><div class="card-h"><h3>Alertas</h3></div><div class="alerts">${alertas().filter(x=>x.a===p.id).map(x=>alertHTML(Object.assign({},x,{k:"open-prof"}))).join("").replace(/data-act="drill" data-k="open-prof" data-a="/g,'data-act="open-prof" data-m="w5" data-id="')}</div></div>`:""}
      <div class="card"><div class="card-h"><h3 style="color:var(--m-fca)">FCA ${st.fca.ok?"✓":""}</h3></div>${tabela(["Fato","Causa","Ação"],p.fca.map(r=>`<tr><td>${esc(r.fato||"—")}</td><td>${esc(r.causa||"—")}</td><td>${esc(r.acao||"—")}</td></tr>`))}</div>
      <div class="card"><div class="card-h"><h3 style="color:var(--m-ish)">Ishikawa ${st.ish.ok?"✓":""}</h3></div><p class="small">Efeito: <b>${esc(I.efeito||"—")}</b> · Causa raiz: <b>${esc(I.raiz||"—")}</b></p><div class="fishwrap">${fishSVG(p)}</div></div>
      <div class="card"><div class="card-h"><h3 style="color:var(--m-5w)">5W2H ${st.w5.ok?"✓":""}</h3><span class="muted small">${m.conc}/${m.acoes} concluídas · ${BRL.format(m.custo)}</span></div>${tabela(["O quê","Quem","Quando","Status"],p.w5h2.map(x=>`<tr><td>${esc(x.oque||"—")}</td><td>${esc(x.quem||"—")}</td><td class="num">${fmtDate(x.quando)}</td><td>${isLate(x)?pill("atrasada"):pill(x.status)}</td></tr>`))}</div>
      <div class="card"><div class="card-h"><h3 style="color:var(--m-pdca)">PDCA ${st.pdca.ok?"✓":""}</h3></div><p class="small">Indicador: <b>${esc(D.indicador||"—")}</b> · Meta: <b>${esc(D.meta||"—")}</b> · Resultado: <b>${esc(D.resultado||"—")}</b></p>${tabela(["Fase","Descrição","Status"],PHASES.map(([k2,L,T2])=>`<tr><td><b>${L}</b> ${T2}</td><td>${esc(D[k2].texto||"—")}</td><td>${pill(D[k2].status)}</td></tr>`))}</div>`};
  }
  if(k==="user"){
    const e=eq.find(x=>x.u.id===a);if(!e)return null;const al=alertas(a);
    return{e:"Usuário",t:e.nome,b:`
      <div class="kpis"><div class="kpi"><span class="lbl">Profissionais</span><div class="v">${e.ps.length}</div></div><div class="kpi"><span class="lbl">Maturidade</span><div class="v">${e.prog}%</div></div><div class="kpi${e.late?" bad":""}"><span class="lbl">Em atraso</span><div class="v">${e.late}</div></div><div class="kpi"><span class="lbl">Ações</span><div class="v">${e.conc}/${e.acoes}</div></div></div>
      <div class="card"><div class="card-h"><h3>Evolução dos profissionais</h3></div>${lineChart(e.ps.map((p,i)=>({name:p.nome,cor:CORES[i%CORES.length],points:profSerie(p),drill:["prof",p.id]})),{h:200,label:"Evolução dos profissionais de "+e.nome})}<div class="legend">${e.ps.map((p,i)=>`<button type="button" data-act="drill" data-k="prof" data-a="${p.id}" aria-pressed="true"><i style="background:${CORES[i%CORES.length]}"></i>${esc(p.nome)}</button>`).join("")}</div></div>
      ${al.length?`<div class="card"><div class="card-h"><h3>Alertas</h3></div><div class="alerts">${al.map(alertHTML).join("")}</div></div>`:""}
      <div class="card"><div class="card-h"><h3>Profissionais</h3></div><div style="display:flex;flex-direction:column;gap:10px">${e.ps.map(pcardHTML).join("")||`<p class="tip">Nenhum profissional cadastrado.</p>`}</div></div>`};
  }
  if(k==="usuarios")return{e:"Gestão",t:"Usuários",b:tabela(["Usuário","Profissionais","Maturidade","Ações","Atraso","Última atividade"],eq.map(e=>`<tr><td>${ulink(e.u.id)}<br><span class="muted small">${esc(e.u.email)}</span></td><td class="num">${e.ps.length}</td><td class="num">${e.prog}%</td><td class="num">${e.conc}/${e.acoes}</td><td class="num">${e.late}</td><td>${e.last?fmtDT(e.last):"—"}</td></tr>`))};
  if(k==="profs")return{e:"Gestão",t:"Profissionais",b:tabela(["Profissional","Usuário","Próximo passo","Maturidade"],S.profs.map(p=>{const ns=nextStep(p);return`<tr><td>${plink(p)}</td><td>${ulink(p.owner)}</td><td>${esc(ns.done?"Ciclo completo":ns.title)}</td><td class="num">${metrics(p).prog}%</td></tr>`}))};
  if(k==="maturidade")return{e:"Gestão",t:"Ranking de maturidade",b:tabela(["#","Profissional","Usuário","Maturidade"],S.profs.slice().sort((x,y)=>metrics(y).prog-metrics(x).prog).map((p,i)=>`<tr><td class="num">${i+1}</td><td>${plink(p)}</td><td>${ulink(p.owner)}</td><td class="num"><b>${metrics(p).prog}%</b></td></tr>`))};
  if(k==="atrasos"||k==="acoes"){const list=allActions().filter(x=>k==="acoes"||isLate(x.a)).sort((x,y)=>(x.a.quando||"9999").localeCompare(y.a.quando||"9999"));
    return{e:"Gestão",t:k==="atrasos"?"Ações em atraso":"Todas as ações",b:tabela(["Ação","Profissional","Usuário","Quem","Prazo","Status"],list.map(({p,a:x})=>`<tr><td>${esc(x.oque||"—")}</td><td>${plink(p)}</td><td>${ulink(p.owner)}</td><td>${esc(x.quem||"—")}</td><td class="num">${fmtDate(x.quando)}</td><td>${isLate(x)?pill("atrasada"):pill(x.status)}</td></tr>`))}}
  if(k==="custos")return{e:"Gestão",t:"Investimento previsto",b:tabela(["Usuário","Profissional","Ações","Custo"],S.profs.map(p=>{const m=metrics(p);return`<tr><td>${ulink(p.owner)}</td><td>${plink(p)}</td><td class="num">${m.acoes}</td><td class="num">${BRL.format(m.custo)}</td></tr>`}))};
  if(k==="pedidos"){closeDrill();S.view="gestao";savePrefs();render();const el=$("#pedidos");if(el&&el.scrollIntoView)el.scrollIntoView({block:"start",behavior:"smooth"});return null}
  if(k==="alertas")return{e:"Gestão",t:"Todos os alertas",b:`<div class="card"><div class="alerts">${alertas().map(alertHTML).join("")||`<p class="tip">Nenhum alerta.</p>`}</div></div>`};
  return null;
}

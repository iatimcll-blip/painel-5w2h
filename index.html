  const[appM,aiM]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-ai.js")]);
  const app=appM.getApps().find(a=>a.name==="ia")||appM.initializeApp(CFG.firebase,"ia");
  const ai=aiM.getAI(app,{backend:new aiM.GoogleAIBackend()});
  IA.model=aiM.getGenerativeModel(ai,{model:"gemini-3.8-flash",systemInstruction:AGENT_RULES,tools:[{functionDeclarations:agentTools()}]});
  return IA.model;
}
function acharProf(nome){
  if(!nome)return cur()||null;const n=String(nome).toLowerCase().trim();
  return S.profs.find(p=>p.nome.toLowerCase()===n)||S.profs.find(p=>p.nome.toLowerCase().includes(n))||S.profs.find(p=>n.includes(firstName(p.nome).toLowerCase()))||null;
}
function agentCtx(){
  const p=cur();
  return Object.assign({tela:S.view,hoje:today(),usuario:{nome:S.perfil&&S.perfil.nome,papel:isAdmin()?"admin":"usuario",privilegios:S.perfil&&S.perfil.priv},
    profissionais_visiveis:S.profs.map(x=>({nome:x.nome,dono:ownerName(x.owner),maturidade:metrics(x).prog,proximo_passo:nextStep(x).title,pode_editar:canEdit(x)})),
    profissional_aberto:p?p.nome:null},p?{detalhe_do_aberto:aiContext(p.id)}:{programa:aiContext("resumo")});
}
async function runTool(name,a,msg){
  const s=v=>String(v==null?"":v).trim(),log=(ok,t)=>{msg.acts.push({ok,t});return ok?{ok:true,resultado:t}:{ok:false,erro:t}};
  const snap=p=>{msg.undo=msg.undo||{profs:{},novos:[],cfg:null};if(p&&!(p.id in msg.undo.profs)&&!msg.undo.novos.includes(p.id))msg.undo.profs[p.id]=JSON.stringify(p)};
  const alvo=()=>{const p=acharProf(a.profissional);if(!p)return[null,log(false,a.profissional?`Não encontrei o profissional "${a.profissional}".`:"Nenhum profissional aberto. Abra ou cite um profissional.")];if(!canEdit(p))return[null,log(false,`Sem permissão para editar ${p.nome}.`)];snap(p);return[p,null]};
  const fim=(p,t)=>{touch(p.id);S.tab=p.id;S.view="painel";render();return log(true,t)};
  switch(name){
    case"abrir_tela":{const v={inicio:"painel",gestao:"gestao",relatorio:"relatorio",aulas:"aulas"}[a.tela];if(!v)return log(false,"Tela desconhecida.");if(v==="gestao"&&!seeTeam())return log(false,"Sem acesso à Gestão.");S.view=v;if(v==="painel")S.tab="resumo";savePrefs();render();return log(true,"Abriu "+a.tela)}
    case"abrir_profissional":{const p=acharProf(a.nome);if(!p)return log(false,`Não encontrei "${a.nome}".`);S.view="painel";S.tab=p.id;if(a.metodo)S.method[p.id]=a.metodo;savePrefs();render();return log(true,"Abriu "+p.nome+(a.metodo?" · "+MLABEL[a.metodo]:""))}
    case"criar_profissional":{if(S.roAll)return log(false,"Sem permissão.");const nome=s(a.nome);if(!nome)return log(false,"Falta o nome.");
      const ordem=S.profs.reduce((x,p)=>Math.max(x,p.ordem),-1)+1,id=uid(),p=norm(id,blankProf(nome,s(a.cargo),s(a.setor),ordem));p.problema=s(a.problema);if(nuvem()&&S.user)p.owner=S.user.id;
      S.profs.push(p);msg.undo=msg.undo||{profs:{},novos:[],cfg:null};msg.undo.novos.push(id);S.method[id]="fca";return fim(p,"Cadastrou "+nome)}
    case"editar_dados_profissional":{const[p,e]=alvo();if(e)return e;["nome","cargo","setor","problema"].forEach(k=>{if(s(a[k]))p[k]=s(a[k])});return fim(p,"Atualizou os dados de "+p.nome)}
    case"preencher_campo":{const[p,e]=alvo();if(e)return e;if(!FIELDLBL[a.campo])return log(false,"Campo desconhecido.");setPath(p,a.campo,s(a.valor));if(a.campo.startsWith("pdca"))S.method[p.id]="pdca";else if(a.campo.startsWith("ishikawa"))S.method[p.id]="ish";return fim(p,`Preencheu ${FIELDLBL[a.campo]}`)}
    case"adicionar_fca":{const[p,e]=alvo();if(e)return e;p.fca.push({fato:s(a.fato),causa:s(a.causa),acao:s(a.acao)});S.method[p.id]="fca";return fim(p,`Adicionou a linha #${p.fca.length} no FCA`)}
    case"editar_fca":{const[p,e]=alvo();if(e)return e;const r=p.fca[(+a.linha)-1];if(!r)return log(false,`A linha ${a.linha} do FCA não existe.`);["fato","causa","acao"].forEach(k=>{if(s(a[k]))r[k]=s(a[k])});S.method[p.id]="fca";return fim(p,`Ajustou a linha #${a.linha} do FCA`)}
    case"adicionar_causa":{const[p,e]=alvo();if(e)return e;const L=p.ishikawa.causas[a.categoria];if(!L)return log(false,"Categoria inválida.");const t=s(a.texto);if(!L.some(c=>c.toLowerCase()===t.toLowerCase()))L.push(t);S.method[p.id]="ish";return fim(p,`Adicionou a causa "${trunc(t,50)}" em ${(CATS.find(c=>c[0]===a.categoria)||[0,""])[1]}`)}
    case"definir_causa_raiz":{const[p,e]=alvo();if(e)return e;p.ishikawa.raiz=s(a.texto);S.method[p.id]="ish";return fim(p,"Definiu a causa raiz")}
    case"adicionar_acao":{const[p,e]=alvo();if(e)return e;p.w5h2.push(newAction(pickA(a)));S.method[p.id]="w5";return fim(p,`Criou a ação ${pad2(p.w5h2.length)}: ${trunc(s(a.oque),60)}`)}
    case"editar_acao":{const[p,e]=alvo();if(e)return e;const x=p.w5h2[(+a.numero)-1];if(!x)return log(false,`A ação ${a.numero} não existe.`);Object.assign(x,pickA(a));S.method[p.id]="w5";return fim(p,`Atualizou a ação ${pad2(+a.numero)}`)}
    case"status_pdca":{const[p,e]=alvo();if(e)return e;if(!p.pdca[a.fase]||!STATUS[a.status])return log(false,"Fase ou status inválido.");p.pdca[a.fase].status=a.status;S.method[p.id]="pdca";return fim(p,`Marcou ${PHASES.find(x=>x[0]===a.fase)[2]} como ${STATUS[a.status]}`)}
    case"dados_programa":{if(cfgLocked())return log(false,"Sem permissão para alterar os dados do programa.");msg.undo=msg.undo||{profs:{},novos:[],cfg:null};if(!msg.undo.cfg)msg.undo.cfg=JSON.stringify(S.cfg);
      if(s(a.titulo))S.cfg.titulo=s(a.titulo);if(s(a.empresa))S.cfg.empresa=s(a.empresa);if(s(a.responsavel))S.cfg.responsavel=s(a.responsavel);if(s(a.parecer))S.cfg.conclusao=s(a.parecer);saveCfg();S.view="relatorio";savePrefs();render();return log(true,"Atualizou os dados do programa")}
    case"gerar_entregavel":{if(!S.profs.length)return log(false,"Não há profissionais para o relatório.");const b=document.createElement("button");b.innerHTML="<small></small>";
      if(a.tipo==="pdf")exportPDF(b);else if(a.tipo==="ppt")exportPPT(b);else exportHTML();return log(true,"Gerou o "+(a.tipo==="ppt"?"PowerPoint":a.tipo.toUpperCase()))}
    case"abrir_aula":{const i=AULAS.findIndex(x=>x.id===a.tema);if(i<0)return log(false,"Aula não encontrada.");AU.c=i;AU.s=0;S.view="aulas";savePrefs();render();return log(true,"Abriu a aula "+AULAS[i].t)}
  }
  return log(false,"Ferramenta desconhecida.");
}
function desfazer(m){
  const u=m.undo;if(!u||m.undone)return;
  Object.entries(u.profs).forEach(([id,json])=>{const old=JSON.parse(json),i=S.profs.findIndex(p=>p.id===id);if(i>=0)S.profs[i]=Object.assign(norm(id,old),{owner:old.owner});touch(id)});
  u.novos.forEach(id=>{if(S.profs.some(p=>p.id===id)){S.profs=S.profs.filter(p=>p.id!==id);if(nuvem())FS().collection("profissionais").doc(id).delete().catch(()=>toast("Não consegui apagar o profissional criado. Peça a quem tem o privilégio Excluir."));else saveLocal();if(S.tab===id)S.tab="resumo"}});
  if(u.cfg){S.cfg=JSON.parse(u.cfg);saveCfg()}
  m.undone=true;render();toast("Desfeito. O painel voltou como estava.");
}
async function agentTurn(text,key,chat,msg){
  const model=await iaModel();
  const history=[];chat.slice(0,-2).slice(-10).forEach(m=>{if(m.role==="user")history.push({role:"user",parts:[{text:m.text}]});else if(m.text&&!m.err&&!m.local&&!m.pending)history.push({role:"model",parts:[{text:m.text}]})});
  while(history.length&&history[0].role!=="user")history.shift();
  const sess=model.startChat({history});
  let r=await sess.sendMessage(`DADOS ATUAIS DO PORTAL (JSON):\n${JSON.stringify(agentCtx())}\n\nMENSAGEM DA PESSOA:\n${text}`);
  for(let i=0;i<8;i++){
    if(msg.cancel)return;
    const calls=(r.response.functionCalls&&r.response.functionCalls())||[];if(!calls.length)break;
    const parts=[];for(const c of calls){const res=await runTool(c.name,c.args||{},msg);parts.push({functionResponse:{name:c.name,response:res}});drawerRender()}
    r=await sess.sendMessage(parts);
  }
  let t="";try{t=r.response.text()}catch(e){}
  msg.text=t||(msg.acts.length?"Pronto.":"Não consegui entender. Pode explicar de outro jeito?");
}
function iaErroMsg(e){
  const m=String(e&&(e.message||e.code)||"");
  if(/genai config not found|api-not-enabled|AI Logic|FAILED_PRECONDITION|PERMISSION_DENIED|403|API key/i.test(m))return["off","A IA ainda não está ativada neste projeto do Firebase. Enquanto isso, sigo com o roteiro do guia."];
  if(/429|quota|RESOURCE_EXHAUSTED/i.test(m))return["err","Limite de uso da IA atingido por agora. Tente de novo em alguns minutos."];
  if(/fetch|network|Failed to load/i.test(m))return["err","Sem conexão com o serviço de IA. Verifique a internet e tente de novo."];
  return["err","A resposta foi interrompida. Tente enviar de novo."];
}

/* ---------- Início ---------- */
async function boot(){
  render();
  const bl=$("#brandlogo");if(bl)bl.innerHTML=logoSVG("b");
  if(window.claude&&window.claude.use){window.claude.use("sample").then(f=>{AI.fn=f;AI.state=f?"on":"off";drawerRender()}).catch(()=>{AI.state="off";drawerRender()})}
  else if(NUVEM_ON){AI.mode="gemini";AI.state="on"}else{AI.state="off"}
  if(NUVEM_ON){bootNuvem();return}
  let db=null,user=null;
  if(window.claude&&window.claude.use){try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}}
  if(db){
    S.mode="db";S.db=db;
    try{if(user&&user.can){const w=await user.can("data.write");if(w===false)S.roAll=true}}catch(e){}
    savedLabel();
    db.collection("profissionais").onSnapshot(onProfs,e=>{S.loaded=true;setSave("err","Sem conexão");render()});
    db.doc("config/geral").onSnapshot(onCfg,()=>{});
    setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},8000);
  }else{
    S.mode="local";loadLocal();sortProfs();S.loaded=true;if(S.tab!=="resumo"&&!cur())S.tab="resumo";savedLabel();render();
  }
}
boot();
})();
